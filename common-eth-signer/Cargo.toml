[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/decoding",
    "crates/signing",
    "crates/displaying",
    "crates/device",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal
signer-core = { path = "crates/core" }
signer-decoding = { path = "crates/decoding" }
signer-signing = { path = "crates/signing" }
signer-displaying = { path = "crates/displaying" }

# Ethereum (alloy) — pinned to one major across the workspace
alloy-primitives = "1"
alloy-dyn-abi = { version = "1", features = ["eip712"] }
alloy-consensus = "1"
alloy-eips = "1"
alloy-rlp = "0.3"

# Crypto / derivation
k256 = { version = "0.13", features = ["ecdsa"] }
bip39 = "2"
bip32 = "0.5"

# Random backend. The `custom` feature lets us supply a TRNG-backed source on
# bare-metal device targets where getrandom has no built-in backend. On the
# host (a supported target) the OS backend is used and `custom` is ignored.
getrandom = { version = "0.2", features = ["custom"] }

# Encoding / utility
ciborium = "0.2"
serde_json = "1"
thiserror = "2"
hex = "0.4"

# UI (feature-gated in the displaying crate)
slint = { version = "1", default-features = false, features = ["compat-1-2", "renderer-software", "std"] }
slint-build = "1"
