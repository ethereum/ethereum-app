<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UR Bridge</title>
<style>
  :root {
    --bg: #101418;
    --panel: #1a2027;
    --panel2: #232b34;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #4dabf7;
    --good: #2fb344;
    --bad: #e03131;
    --border: #2e3843;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* --- tabs --- */
  nav {
    display: flex;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  nav button {
    flex: 1;
    padding: 16px 4px;
    font-size: 17px;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--muted);
    cursor: pointer;
  }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { flex: 1; padding: 12px; max-width: 640px; margin: 0 auto; width: 100%; }
  .view { display: none; }
  .view.active { display: block; }
  h2 { font-size: 16px; margin: 14px 0 8px; color: var(--muted); font-weight: 600; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
  }
  button.big {
    display: block; width: 100%;
    padding: 15px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #04121f;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
  }
  button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: 0.4; }
  select, input[type=text], textarea {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
  }
  textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; min-height: 84px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .mono {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    word-break: break-all;
    white-space: pre-wrap;
    max-height: 180px;
    overflow-y: auto;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
  }
  .err { color: var(--bad); font-size: 14px; margin-top: 8px; }
  .ok { color: var(--good); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  /* --- scan --- */
  #video-wrap { position: relative; border-radius: 10px; overflow: hidden; background: #000; }
  #video { width: 100%; display: block; max-height: 55vh; object-fit: cover; }
  #progress-outer {
    height: 14px; border-radius: 7px;
    background: var(--panel2);
    border: 1px solid var(--border);
    overflow: hidden;
    margin: 8px 0;
  }
  #progress-inner { height: 100%; width: 0%; background: var(--good); transition: width 0.2s; }
  #scan-stats { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  #scan-log { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 16px;
              font-family: ui-monospace, Menlo, Consolas, monospace; }
  /* --- display --- */
  #qr-card {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    width: fit-content;
    max-width: 96vw;
    margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
  }
  /* canvas is sized in JS to an exact physical-pixel multiple of the module
     size; never let CSS rescale it or the module edges go soft */
  #qr-card canvas { display: block; image-rendering: pixelated; }
  #qr-info { text-align: center; font-size: 13px; color: var(--muted); margin-top: 4px; }
  #qr-size-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  #qr-size-row input[type="range"] { flex: 1; }
  #qr-size-label { font-size: 14px; color: var(--muted); min-width: 64px; text-align: right; }
  #part-label { text-align: center; font-size: 20px; font-weight: 700; margin: 10px 0 2px; }
  #ur-text {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 10px; color: var(--muted);
    word-break: break-all;
    text-align: center;
    margin: 6px 0 10px;
    max-height: 60px; overflow-y: auto;
  }
  .nav-row { display: flex; gap: 10px; }
  .nav-row button {
    flex: 1;
    padding: 20px 0;
    font-size: 22px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-weight: 700;
    cursor: pointer;
  }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  /* --- vectors --- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td button {
    padding: 8px 14px; border-radius: 8px; border: none;
    background: var(--accent); color: #04121f; font-weight: 700; cursor: pointer;
  }
  #test-results div { font-size: 13px; padding: 3px 0; font-family: ui-monospace, Menlo, Consolas, monospace; }
  footer {
    text-align: center; color: var(--muted); font-size: 12px;
    padding: 10px; border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<nav>
  <button id="tab-scan" class="active">Scan</button>
  <button id="tab-display">Display</button>
  <button id="tab-vectors">Vectors</button>
</nav>

<main>
  <!-- ============================ SCAN ============================ -->
  <section id="view-scan" class="view active">
    <div id="video-wrap" class="card" style="padding:0">
      <video id="video" playsinline muted></video>
    </div>
    <button id="btn-camera" class="big">Start camera</button>
    <div id="camera-error" class="err" style="display:none"></div>

    <div class="card" style="margin-top:12px">
      <div style="font-size:15px"><b id="scan-type">–</b></div>
      <div id="progress-outer"><div id="progress-inner"></div></div>
      <div id="scan-stats">
        <span id="scan-parts">parts 0/?</span>
        <span id="scan-pct">0%</span>
      </div>
      <div id="scan-log"></div>
    </div>

    <div id="scan-result" class="card" style="display:none">
      <div style="font-size:15px; margin-bottom:6px">Decoded <b id="result-type"></b>,
        <span id="result-len"></span> bytes CBOR</div>
      <div id="result-hex" class="mono"></div>
      <button id="btn-to-display" class="big">Display to signer &#8594;</button>
      <button id="btn-scan-reset" class="big secondary">Scan another</button>
    </div>

    <h2>No camera? Alternatives</h2>
    <div class="card">
      <label>Decode a photo of a QR code</label>
      <input type="file" id="file-input" accept="image/*" capture="environment"
             style="width:100%; font-size:14px; color:var(--muted)">
      <div id="file-status" class="hint"></div>
      <label>Paste UR part strings (one per line)</label>
      <textarea id="paste-parts" placeholder="UR:ETH-SIGN-REQUEST/1-3/LPAD..."></textarea>
      <button id="btn-add-parts" class="big secondary">Add parts</button>
      <div id="paste-status" class="hint"></div>
    </div>
  </section>

  <!-- ============================ DISPLAY ============================ -->
  <section id="view-display" class="view">
    <div id="display-empty" class="card">
      Nothing loaded yet. Scan a UR, load a test vector, or paste CBOR hex below.
    </div>
    <div id="display-main" style="display:none">
      <div class="hint" id="display-source" style="margin-bottom:8px"></div>
      <div id="qr-card"></div>
      <div id="qr-info"></div>
      <div id="qr-size-row">
        <label for="qr-size" style="margin:0">QR size</label>
        <input type="range" id="qr-size" min="200" max="1000" step="10" value="480">
        <span id="qr-size-label">480 px</span>
      </div>
      <div id="part-label">Part 1 of 1</div>
      <div id="ur-text"></div>
      <div class="nav-row">
        <button id="btn-prev">&#9664; Prev</button>
        <button id="btn-next">Next &#9654;</button>
      </div>
      <div class="row2" style="margin-top:10px">
        <div>
          <label>Fragment size (bytes)</label>
          <select id="frag-size">
            <option>25</option><option>40</option><option>60</option><option selected>80</option>
            <option>100</option><option>120</option><option>140</option><option>160</option>
            <option>180</option><option>200</option>
          </select>
        </div>
        <div>
          <label>Auto-advance</label>
          <select id="auto-advance">
            <option value="0" selected>Off</option>
            <option value="500">0.5s</option>
            <option value="1000">1s</option>
            <option value="2000">2s</option>
          </select>
        </div>
      </div>
    </div>

    <h2>Load CBOR manually</h2>
    <div class="card">
      <label>UR type</label>
      <input type="text" id="manual-type" value="eth-sign-request" autocapitalize="none">
      <label>Message CBOR (hex)</label>
      <textarea id="manual-hex" placeholder="a701d825..."></textarea>
      <button id="btn-manual-load" class="big secondary">Load</button>
      <div id="manual-status" class="err" style="display:none"></div>
    </div>
  </section>

  <!-- ============================ VECTORS ============================ -->
  <section id="view-vectors" class="view">
    <h2>Embedded test vectors</h2>
    <div class="card" style="overflow-x:auto">
      <table id="vectors-table">
        <thead><tr><th>Name</th><th>Type</th><th>CBOR</th><th>Parts</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <h2>Self-tests</h2>
    <div class="card">
      <button id="btn-run-tests" class="big secondary" style="margin-top:0">Run self-tests</button>
      <div id="test-summary" style="margin-top:8px; font-size:15px"></div>
      <div id="test-results"></div>
    </div>
  </section>
</main>

<footer id="footer">decode engine: detecting&#8230;</footer>
